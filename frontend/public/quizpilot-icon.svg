<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Modern Blue to Purple Learning Gradient -->
    <linearGradient id="qpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Golden Academic Achievement Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Contrast Drop Shadow for Browser Tab Legibility -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Icon Tile Base (Clean on Dark & Light Browser Tab Bars) -->
  <rect width="32" height="32" rx="7.5" fill="url(#qpGradient)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Foundation: Open Book (Board Syllabus & Smart Revision) -->
  <g filter="url(#tabShadow)">
    <!-- Left Page -->
    <path d="M 6.5 24.2 C 9.5 22.5 12.8 22.5 15.5 23.8 L 15.5 17.5 C 12.8 16.2 9.5 16.2 6.5 17.8 Z" 
          fill="#F8FAFC" fill-opacity="0.95"/>
    
    <!-- Right Page -->
    <path d="M 25.5 24.2 C 22.5 22.5 19.2 22.5 16.5 23.8 L 16.5 17.5 C 19.2 16.2 22.5 16.2 25.5 17.8 Z" 
          fill="#E0E7FF" fill-opacity="0.95"/>
    
    <!-- Book Center Crease -->
    <path d="M 16 17.5 L 16 24" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Book Bottom Binding Curve -->
    <path d="M 14.2 24.5 C 15.2 25.1 16.8 25.1 17.8 24.5" stroke="#CBD5E1" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Hero Element: Bold Ascending Quiz Checkmark (Mastery & Evaluation) -->
  <path d="M 8.5 14.2 L 13.8 19.5 L 23.8 7.2" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#tabShadow)"/>

  <!-- Smart Learning / Star Accent -->
  <path d="M 25.5 3.8 C 25.5 5.3 27 6 27 6 C 27 6 25.5 6.7 25.5 8.2 C 25.5 6.7 24 6 24 6 C 24 6 25.5 5.3 25.5 3.8 Z" 
        fill="url(#goldAccent)"/>
</svg>
